<linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#8a9bb3" stop-opacity=".55"/><stop offset=".4" stop-color="#8a9bb3" stop-opacity=".55"/><stop offset="1" stop-color="#8a9bb3" stop-opacity="0"/></linearGradient>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#1fa57e" stop-opacity="0"/><stop offset=".7" stop-color="#1fa57e"/><stop offset="1" stop-color="#1fa57e" stop-opacity="0"/></linearGradient>
</defs>
<rect x="60" y="19" width="400" height="2" rx="1" fill="url(#l)"/>
<rect x="540" y="19" width="400" height="2" rx="1" fill="url(#r)"/>
