<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="1000" height="40" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.b{transform-box:fill-box;transform-origin:center;animation:beat 1.4s ease-in-out infinite}
.b0,.b6{animation-duration:1.1s}.b1,.b5{animation-duration:1.5s;animation-delay:.2s}.b2,.b4{animation-duration:1.3s;animation-delay:.1s}.b3{animation-duration:1.7s}
@keyframes beat{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
.gl{opacity:0;animation:run 5s ease-in-out infinite}
.gr{opacity:0;animation:runr 5s ease-in-out infinite}
@keyframes run{0%{opacity:0;transform:translateX(0)}10%{opacity:1}50%{opacity:1;transform:translateX(300px)}60%,100%{opacity:0;transform:translateX(300px)}}
@keyframes runr{0%{opacity:0;transform:translateX(0)}10%{opacity:1}50%{opacity:1;transform:translateX(-300px)}60%,100%{opacity:0;transform:translateX(-300px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
